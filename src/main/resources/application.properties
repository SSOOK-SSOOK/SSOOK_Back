spring.application.name=SSOOK_BACK

# ===============================
# 1. 서버 포트 설정
# ===============================
server.port=8080

# ===============================
# 2. MySQL DB 연결 설정
# ===============================
# DB Schema: ssookssook
# User/PW: ssafy / ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssookssook?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# ===============================
# 3. MyBatis 설정
# ===============================
mybatis.type-aliases-package=com.ssook.mvc.entity
mybatis.mapper-locations=classpath:mapper/**/*.xml
# user_id (DB) -> userId (Java)
mybatis.configuration.map-underscore-to-camel-case=true

# ===============================
# 4. 로그 설정
# ===============================
logging.level.com.ssook.mvc.repository=TRACE

# ===============================
# 5. JWT 설정
# ===============================
# HS256 알고리즘을 사용하므로 32글자 이상이어야 안전합니다.
jwt.secret=SsookProjectSecretKeyForJwtLoginTokenGenerate2025