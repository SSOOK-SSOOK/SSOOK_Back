spring.application.name=SSOOK_BACK

# ===============================
# 1. 서버 포트 설정
# ===============================
server.port=8080

# ===============================
# 2. MySQL DB 연결 설정 (수정됨)
# ===============================
# DB Schema: ssookssook
# User/PW: ssafy / ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssookssook?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# ===============================
# 3. MyBatis 설정 (패키지명 반영)
# ===============================
# DTO 위치: com.ssook.mvc.dto (패키지명 변경 반영)
mybatis.type-aliases-package=com.ssook.mvc.dto
# XML Mapper 위치
mybatis.mapper-locations=classpath:mapper/**/*.xml
# user_id (DB) -> userId (Java) 자동 변환
mybatis.configuration.map-underscore-to-camel-case=true

# ===============================
# 4. 로그 설정 (패키지명 반영)
# ===============================
# 우리가 만든 Mapper가 실행될 때 SQL을 콘솔에 출력
logging.level.com.ssook.mvc.mapper=TRACE